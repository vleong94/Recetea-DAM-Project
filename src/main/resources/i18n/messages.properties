# ── GlobalExceptionHandler alerts ────────────────────────────────────────────
# DomainException ErrorCode-keyed alerts (key pattern: error.{ENUM_NAME}.{title|header|content})
error.VALIDATION_ERROR.title=Validation Error
error.VALIDATION_ERROR.header=[VAL-400] {0} validation error(s) found
error.NOT_FOUND.title=Resource Not Found
error.NOT_FOUND.header=[404] Resource not found
error.NOT_FOUND.content=The requested resource does not exist or has been removed.
error.UNAUTHORIZED.title=Access Denied
error.UNAUTHORIZED.header=[SEC-403] Insufficient permissions
error.UNAUTHORIZED.content=You do not have permission to modify or delete this recipe.
error.AUTHENTICATION_REQUIRED.title=Authentication Required
error.AUTHENTICATION_REQUIRED.header=[SEC-401] Login required
error.AUTHENTICATION_REQUIRED.content=You must be logged in to perform this action.
error.CONFLICT.title=Operation Not Allowed
error.CONFLICT.header=[409] Conflict with current state
error.CONFLICT.content=The operation conflicts with the current state of the resource.
error.INTERNAL_ERROR.title=Domain Error
error.INTERNAL_ERROR.header=[BIZ-400] Domain rule violation
error.INTERNAL_ERROR.content=A domain rule was violated while processing the request.
error.VALIDATION_ERROR.content=One or more fields contain invalid values. Review the messages and try again.

# Non-domain alert keys keyed verbatim by GlobalExceptionHandler.categorize() — case and
# dash matter: the handler emits codes like INT-400 / INF-500 / DB-500 / ERR-500 and queries
# error.{code}.{title|header|content}. Lowercase aliases were dead and have been removed.
error.INT-400.title=Interoperability Error
error.INT-400.header=[INT-400] XML import/export failure
error.INT-400.content=The XML payload could not be imported or exported. See the message below for the schema-level detail.
error.INF-500.title=Technical Error
error.INF-500.header=[INF-500] Infrastructure failure
error.INF-500.content=A technical error occurred. Please try again or contact support.
error.DB-500.title=Database Error
error.DB-500.header=[DB-500] Database failure
error.DB-500.content=A database error occurred. Please try again or contact support.
error.ERR-500.title=System Error
error.ERR-500.header=[ERR-500] An unexpected error occurred
error.ERR-500.content=An internal server error occurred. Please check the logs or contact support.

# Catch-of-last-resort path — used only when GlobalExceptionHandler itself fails while
# rendering the primary alert. Hardcoded English here would defeat the entire i18n contract.
error.fallback.title=Fatal Error
error.fallback.header=Application Error
error.fallback.content=An unexpected error occurred while reporting another error. Check the application logs.

